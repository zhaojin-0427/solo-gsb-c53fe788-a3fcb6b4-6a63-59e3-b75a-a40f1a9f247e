services:
  spreadsheet-audit:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - spreadsheet-data:/data
    environment:
      SPREADSHEET_DB: /data/spreadsheet.db
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health')"]
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  spreadsheet-data:
